
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerca nel database</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<!-- Plotly.js caricato una sola volta da CDN -->
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #f5f7fa;
    color: #1a1a1a;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 2rem;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* Titoli nelle card */
.card h2 {
    margin-top: 0;
    color: #1e3c72;
}

.card h3 {
    margin-top: 0;
    color: #1e3c72;
    border-bottom: 2px solid #eef1f6;
    padding-bottom: 0.6rem;
}

/* Link al dataset annotato */
.dataset-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 1rem;
    padding: 8px 14px;
    border: 1px solid #d5dcea;
    border-radius: 10px;
    background: #f9fbff;
    color: #095775;
    font-size: 0.92rem;
    font-weight: 500;
    text-decoration: none;
}

.dataset-link:hover {
    border-color: #b51700;
    color: #b51700;
}

.dataset-link svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
}

.dataset-links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 1rem;
}

.dataset-links .dataset-link {
    margin-top: 0;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #eee;
    text-align: left;
}

tr:hover {
    background: #f9fbff;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 0.9rem;
    border-radius: 12px;
    border: 1px solid #ddd;
    margin-bottom: 1rem;
    font-size: 1rem;
}

.badge {
    background: #2a5298;
    color: white;
    padding: 3px 8px;
    border-radius: 8px;
    font-size: 12px;
}

.plot-container {
    width: 100%;
    height: 400px;
}

/* =========================================
   STILE ESEMPI (SCHEDA / KIPARLA)
   ========================================= */
.example-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
    margin: 10px 0 14px 0;
    padding: 12px 16px;
}

.example-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 8px;
    margin-bottom: 8px;
    border-bottom: 1px solid #edf2f7;
}

/* Nome corpus + Conv_ID in testo normale con virgola */
.conv-id {
    font-weight: 600;
    color: #334155;
    font-size: 0.92rem;
}

.audio-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background-color: #095775;
    color: #ffffff !important;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 16px;
    text-decoration: none !important;
    transition: background-color 0.2s ease;
}

.audio-btn:hover {
    background-color: #b51700;
}

/* Pulsanti accanto all'intestazione dell'esempio */
.example-actions {
    display: inline-flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
}

.read-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background-color: #ffffff;
    color: #095775 !important;
    border: 1px solid #095775;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 16px;
    text-decoration: none !important;
    transition: color 0.2s ease, border-color 0.2s ease;
}

.read-btn:hover {
    color: #b51700 !important;
    border-color: #b51700;
}

.transcript-table {
    width: 100%;
    border-collapse: collapse;
}

.transcript-table tr {
    border-bottom: 1px solid #f8fafc;
}

.transcript-table tr:last-child {
    border-bottom: none;
}

/* Evidenziazione del turno target: azzurrino leggero e sobrio */
.transcript-table tr.focus {
    background-color: #f0f7ff !important;
    border-left: 3px solid #3182ce;
}

.speaker-col {
    width: 80px;
    min-width: 70px;
    font-weight: 700;
    font-size: 0.88rem;
    vertical-align: top;
    padding: 6px 10px 6px 8px;
}

.text-col {
    color: #2d3748;
    font-size: 0.95rem;
    line-height: 1.5;
    vertical-align: top;
    padding: 6px 8px;
}

/* Parola target in rosso pulito: NO box, NO sfondi, NO bordi */
.text-col b {
    font-weight: 700;
    color: #c53030;
    background: none;
    border: none;
    padding: 0;
}

.ex-cell {
    padding: 10px 15px;
}

.example-card.error {
    color: #e53e3e;
    background-color: #fff5f5;
    border-color: #fed7d7;
}

/* =========================================
   HEADER E NAVBAR
   ========================================= */
.header {
    background: #ffffff;
    border-bottom: 1px solid #e5e5e5;
}

.brand {
    --unisa-h: 100px;
    --dipsum-w: 130px;
    --stack-gap: 5px;
    --side-gap: clamp(16px, 6vw, 100px);
    --side-lift: 30px;
    --parole-scale: 1.08;

    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    padding: 0.6rem 1.5rem 0 1.5rem;
}

.brand img { display: block; }

.brand .logo-main {
    height: 250px;
    width: auto;
    margin-bottom: 8px;
    grid-column: 2;
}

.brand .side { margin-bottom: var(--side-lift); }

.brand .side-left {
    grid-column: 1;
    justify-self: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--stack-gap);
}

.brand .side-right {
    grid-column: 3;
    justify-self: center;
}

.brand .logo-unisa  { height: var(--unisa-h); width: auto; }
.brand .logo-dipsum { width: var(--dipsum-w); height: auto; }

.brand .logo-parole {
    height: calc((var(--unisa-h) + var(--stack-gap) + var(--dipsum-w) / 3.556) * var(--parole-scale));
    width: auto;
}

@media (max-width: 700px) {
    .brand {
        --unisa-h: 55px;
        --dipsum-w: 72px;
        --stack-gap: 4px;
        --side-lift: 12px;
        padding: 0.6rem 0.8rem 0 0.8rem;
    }
    .brand .logo-main { height: 140px; }
}

.navbar {
    display: flex;
    justify-content: center;
    gap: 24px;
    padding: 6px 0 10px 0;
    background: white;
    margin-top: 6px;
}

.navbar a {
    text-decoration: none;
    color: #095775;
    font-weight: 500;
    font-size: 0.95rem;
}

.navbar a:hover {
    color: #b51700;
}

.dropdown {
    position: relative;
}

.dropdown-content {
    display: none;
    position: absolute;
    top: 22px;
    background: white;
    min-width: 160px;
    border: 1px solid #eee;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    z-index: 100;
}

.dropdown-content a {
    display: block;
    padding: 10px;
    font-size: 0.9rem;
}

.dropdown-content a:hover {
    background: #f5f7fa;
}

.dropdown:hover .dropdown-content {
    display: block;
}

/* Ricerca avanzata */
.adv-toggle {
    background: none;
    border: none;
    padding: 0;
    color: #095775;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
}

.adv-toggle:hover {
    color: #b51700;
}

.adv-panel {
    display: none;
    margin-top: 1rem;
}

.adv-panel label {
    display: block;
    font-size: 0.85rem;
    color: #555;
    margin-bottom: 4px;
}

.adv-panel input {
    margin-bottom: 0;
}

/* Intestazioni ordinabili */
th.sortable {
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
}

th.sortable:hover {
    color: #b51700;
}

th.sortable .sort-icon {
    display: inline-block;
    margin-left: 4px;
    font-size: 0.8rem;
    color: #999;
}

/* Titolo della voce + pulsante "Cita" */
.title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
}

.cite-jump {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    margin-top: 4px;
    padding: 6px 12px;
    border: 1px solid #d5dcea;
    border-radius: 10px;
    background: #f9fbff;
    color: #095775;
    font-size: 0.88rem;
    font-weight: 500;
    text-decoration: none;
}

.cite-jump:hover {
    border-color: #b51700;
    color: #b51700;
}

.cite-jump svg {
    width: 16px;
    height: 16px;
}

html {
    scroll-behavior: smooth;
}

#cita {
    scroll-margin-top: 20px;
}

/* Note dei grafici (su mobile la nota esce dal grafico) */
.plot-note {
    font-size: 0.8rem;
    color: #6b7280;
    margin: 0.4rem 0 0 0;
    text-align: center;
}

/* Pulsante menu: visibile solo su mobile */
.nav-toggle {
    display: none;
}

.navbar {
    flex-wrap: wrap;
}

@media (max-width: 700px) {

    /* --- spazi --- */
    .container { padding: 1rem; }
    .card { padding: 1rem; border-radius: 12px; }

    /* --- menu ☰ --- */
    .nav-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px auto 8px auto;
        padding: 8px 16px;
        border: 1px solid #d5dcea;
        border-radius: 10px;
        background: #f9fbff;
        color: #095775;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
    }

    .nav-toggle-bars,
    .nav-toggle-bars::before,
    .nav-toggle-bars::after {
        display: block;
        width: 18px;
        height: 2px;
        background: currentColor;
        border-radius: 2px;
        position: relative;
    }

    .nav-toggle-bars::before,
    .nav-toggle-bars::after {
        content: "";
        position: absolute;
        left: 0;
    }

    .nav-toggle-bars::before { top: -6px; }
    .nav-toggle-bars::after  { top: 6px; }

    .navbar {
        display: none;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        margin: 0;
        padding: 0 0 8px 0;
        border-top: 1px solid #eee;
    }

    .navbar.open { display: flex; }

    .navbar > a,
    .dropdown > a {
        display: block;
        padding: 12px 1.2rem;
        border-bottom: 1px solid #f1f1f1;
    }

    /* sottomenu: niente hover, si apre al tocco */
    .dropdown:hover .dropdown-content { display: none; }

    .dropdown-content,
    .dropdown.open .dropdown-content {
        position: static;
        box-shadow: none;
        border: none;
        min-width: 0;
        background: #f9fbff;
    }

    .dropdown.open .dropdown-content { display: block; }

    .dropdown-content a {
        padding: 10px 2.2rem;
        border-bottom: 1px solid #f1f1f1;
    }

    /* --- microfunzioni ed esempi --- */
    /* righe come griglie: freccia | microfunzione | frequenza */
    .micro-table,
    .micro-table tbody { display: block; }

    .micro-table tr {
        display: grid;
        grid-template-columns: 22px 1fr auto;
        align-items: center;
        border-bottom: 1px solid #eee;
    }

    .micro-table th,
    .micro-table td { padding: 10px 6px; border-bottom: none; }

    .micro-table .col-macro { display: none; }
    .micro-table .col-arrow { width: auto !important; padding-right: 0; }

    /* riga degli esempi: una cella a tutta larghezza */
    .micro-table tr[id^="ex"] { grid-template-columns: 1fr; }
    .micro-table tr[id^="ex"][style*="none"] { display: none !important; }

    .micro-table td.ex-cell { padding: 8px 2px; }

    .example-card { padding: 10px 12px; margin: 8px 0 10px 0; }

    .example-header {
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 8px;
    }

    .example-actions { justify-content: flex-start; }

    /* turni: parlante sopra la battuta invece che a fianco */
    .transcript-table,
    .transcript-table tbody,
    .transcript-table tr,
    .transcript-table td {
        display: block;
        width: auto;
    }

    .transcript-table td { border-bottom: none; }

    .speaker-col {
        width: auto;
        min-width: 0;
        font-size: 0.78rem;
        padding: 6px 8px 0 8px;
    }

    .text-col {
        font-size: 0.92rem;
        padding: 0 8px 6px 8px;
    }

    /* --- pagina di ricerca: ogni segnale diventa una scheda --- */
    .search-table thead tr,
    .search-table tbody tr {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        border-bottom: 1px solid #eee;
    }

    .search-table th,
    .search-table td {
        border-bottom: none;
        padding: 10px 6px;
    }

    .search-table th:nth-child(2),
    .search-table td:nth-child(2) { text-align: right; }

    .search-table th:nth-child(3) { display: none; }

    .search-table td:nth-child(3) {
        grid-column: 1 / -1;
        padding-top: 0;
        font-size: 0.85rem;
        color: #666;
    }

    .search-table .badge { white-space: nowrap; }

    /* --- grafici --- */
    .plot-container { height: 360px; }
    .plot-map { height: 440px; }
}

/* Footer */
.footer {
    background: #ffffff;
    border-top: 1px solid #e5e5e5;
    margin-top: 2rem;
}

.footer-inner {
    max-width: 1100px;
    margin: auto;
    padding: 1.2rem 2rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-size: 0.88rem;
    color: #666;
}

.footer-links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 18px;
}

.footer-links a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #095775;
    text-decoration: none;
    font-weight: 500;
}

.footer-links a:hover {
    color: #b51700;
}

.footer-links svg {
    width: 16px;
    height: 16px;
}

/* Come citare questa voce */
.cite-text {
    font-size: 0.95rem;
    line-height: 1.6;
    color: #333;
    background: #f9fbff;
    border-left: 3px solid #095775;
    padding: 0.8rem 1rem;
    margin: 0 0 1rem 0;
    word-break: break-word;
}

.cite-text a {
    color: #095775;
}

.cite-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.cite-btn {
    display: inline-flex;
    align-items: center;
    padding: 8px 14px;
    border: 1px solid #d5dcea;
    border-radius: 10px;
    background: #f9fbff;
    color: #095775;
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 500;
    cursor: pointer;
}

.cite-btn:hover {
    border-color: #b51700;
    color: #b51700;
}

.cite-btn.copied {
    border-color: #2f855a;
    color: #2f855a;
}

.cite-btn-ghost {
    background: none;
    border-color: transparent;
}

.cite-bib {
    margin: 1rem 0 0 0;
    padding: 0.9rem 1rem;
    background: #1e293b;
    color: #e2e8f0;
    border-radius: 10px;
    font-size: 0.82rem;
    line-height: 1.5;
    overflow-x: auto;
}

th.sortable[aria-sort="ascending"] .sort-icon,
th.sortable[aria-sort="descending"] .sort-icon {
    color: #2a5298;
}
</style>

<script>
function toggle(id) {
    const el = document.getElementById(id);
    const arrow = document.getElementById('arrow-' + id);
    const isHidden = el.style.display === "none";

    el.style.display = isHidden ? "" : "none";
    if (arrow) {
        arrow.textContent = isHidden ? "▲" : "↕";
    }
}

// Data di consultazione nella citazione (oggi, in italiano e ISO)
document.addEventListener("DOMContentLoaded", () => {
    const d = new Date();
    const it = d.toLocaleDateString("it-IT", {day: "numeric", month: "long", year: "numeric"});
    const iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    document.querySelectorAll(".cite-date").forEach(el => el.textContent = it);
    document.querySelectorAll(".cite-date-iso").forEach(el => el.textContent = iso);
});

function copyCite(id, btn) {
    const text = document.getElementById(id).textContent.trim();
    const label = btn.textContent;
    const done = () => {
        btn.textContent = "Copiato ✓";
        btn.classList.add("copied");
        setTimeout(() => { btn.textContent = label; btn.classList.remove("copied"); }, 1800);
    };
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done);
    } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        done();
    }
}

function toggleBib(btn) {
    const pre = document.getElementById("cite-bib");
    pre.hidden = !pre.hidden;
    btn.textContent = pre.hidden ? "Mostra BibTeX" : "Nascondi BibTeX";
}

// ---------- Menu mobile ----------
const MOBILE = window.matchMedia("(max-width: 700px)");

function toggleNav(btn) {
    const nav = document.getElementById("main-nav");
    const open = nav.classList.toggle("open");
    btn.setAttribute("aria-expanded", open);
}

// "Progetto ▾": su mobile il primo tocco apre il sottomenu, il secondo va alla pagina
function openDropdown(ev, link) {
    if (!MOBILE.matches) return true;
    const dd = link.parentElement;
    if (dd.classList.contains("open")) return true;
    ev.preventDefault();
    dd.classList.add("open");
    return false;
}

// ---------- Grafici su mobile ----------
function adaptForMobile(div, fig) {
    const L = fig.layout || {};
    const isMap = fig.data.some(t => t.type === "choropleth");

    // il titolo è già nella card: lo togliamo per guadagnare spazio
    L.title = {text: ""};

    // la nota sulla proiezione esce dal grafico e va sotto, come testo
    if (L.annotations && L.annotations.length) {
        L.annotations.forEach(a => {
            const p = document.createElement("p");
            p.className = "plot-note";
            p.innerHTML = a.text;
            div.after(p);
        });
        L.annotations = [];
    }

    L.dragmode = false;

    if (isMap) {
        L.margin = {l: 0, r: 0, t: 0, b: 70};
        // inquadratura fissa sull'Italia: la mappa riempie lo spazio disponibile
        L.geo = Object.assign({}, L.geo, {
            fitbounds: false,
            projection: {type: "mercator"},
            lataxis: {range: [36.4, 47.2]},
            lonaxis: {range: [6.4, 18.7]}
        });
        // barra dei colori orizzontale sotto la mappa
        const cb = {
            orientation: "h", x: 0.5, xanchor: "center",
            y: -0.02, yanchor: "top", thickness: 10, len: 0.85,
            title: {side: "top", font: {size: 11}}, tickfont: {size: 10}
        };
        if (L.coloraxis) {
            L.coloraxis.colorbar = Object.assign({}, L.coloraxis.colorbar, cb,
                {title: Object.assign({}, (L.coloraxis.colorbar || {}).title, cb.title)});
        }
        fig.data.forEach(t => {
            if (t.type === "scattergeo" && t.mode === "text") {
                t.textfont = Object.assign({}, t.textfont, {size: 10});
            }
        });
        if (L.legend) {
            L.legend = Object.assign({}, L.legend, {y: -0.25, font: {size: 10}});
        }
    } else {
        L.margin = {l: 50, r: 10, t: 10, b: 10};
        L.xaxis = Object.assign({}, L.xaxis, {
            automargin: true, tickangle: -35, tickfont: {size: 10},
            title: {text: ""}
        });
        L.yaxis = Object.assign({}, L.yaxis, {
            automargin: true, tickfont: {size: 10}
        });
        L.yaxis.title = Object.assign({}, L.yaxis.title, {font: {size: 11}});
    }

    fig.layout = L;
    return fig;
}

function loadPlot(divId, jsonPath) {
    fetch(jsonPath, {cache: "no-cache"})
        .then(r => {
            if (!r.ok) throw new Error("Impossibile caricare " + jsonPath);
            return r.json();
        })
        .then(fig => {
            const div = document.getElementById(divId);
            const config = {responsive: true};
            if (MOBILE.matches) {
                fig = adaptForMobile(div, fig);
                config.displayModeBar = false;
                config.scrollZoom = false;
            }
            Plotly.newPlot(divId, fig.data, fig.layout, config);
        })
        .catch(err => {
            document.getElementById(divId).innerText = "Grafico non disponibile";
            console.error(err);
        });
}
</script>
</head>
<body>

<header class="header">

    <div class="brand">
        <div class="side side-left">
            <a href="https://www.unisa.it" target="_blank" rel="noopener">
                <img class="logo-unisa" src="logo_unisa.png" alt="Università di Salerno">
            </a>
            <a href="https://www.dipsum.unisa.it" target="_blank" rel="noopener">
                <img class="logo-dipsum" src="logo_dipsum.png" alt="DipSUM - Dipartimento di Studi Umanistici">
            </a>
        </div>
        <a href="https://laboratorioparole.github.io/cosi/" target="_blank" rel="noopener">

<div class="container">

<div class="card">
  <h2>Ricerca per segnale discorsivo</h2>
  <input id="search" type="text" placeholder="Cerca segnale...">

  <button type="button" class="adv-toggle" id="advToggle" aria-expanded="false">+ Ricerca avanzata</button>

  <div class="adv-panel" id="advPanel">
    <label for="searchMicro">Microfunzione</label>
    <input id="searchMicro" type="text" placeholder="Es. riformulazione, presa di turno...">
  </div>
</div>

<div class="card">
<table class="search-table">
<thead>
<tr>
<th class="sortable" data-key="lemma" aria-sort="none">Segnale<span class="sort-icon">↕</span></th>
<th class="sortable" data-key="frequenza" aria-sort="none">Fascia di frequenza<span class="sort-icon">↕</span></th>
<th>Microfunzioni</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<script src="data.js"></script>

<script>
const tableBody = document.querySelector("tbody");
const input = document.getElementById("search");
const microInput = document.getElementById("searchMicro");
const advToggle = document.getElementById("advToggle");
const advPanel = document.getElementById("advPanel");
const headers = document.querySelectorAll("th.sortable");

const FREQ_ORDER = ["alta", "medio-alta", "medio-bassa", "bassa"];
const collator = new Intl.Collator("it", { sensitivity: "base" });

let sortKey = null;
let sortDir = "asc";

function norm(s) {
    return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
}

function freqRank(f) {
    const i = FREQ_ORDER.indexOf(String(f || "").trim().toLowerCase());
    return i === -1 ? FREQ_ORDER.length : i;
}

function compare(a, b) {
    let r;
    if (sortKey === "frequenza") {
        r = freqRank(a.frequenza) - freqRank(b.frequenza);
        if (r === 0) r = collator.compare(a.lemma, b.lemma);
    } else {
        r = collator.compare(a.lemma, b.lemma);
    }
    return sortDir === "asc" ? r : -r;
}

function updateHeaders() {
    headers.forEach(th => {
        const active = th.dataset.key === sortKey;
        th.setAttribute("aria-sort", active ? (sortDir === "asc" ? "ascending" : "descending") : "none");
        th.querySelector(".sort-icon").textContent = active ? (sortDir === "asc" ? "▲" : "▼") : "↕";
    });
}

function render() {
    const qLemma = norm(input.value);
    const qMicro = norm(microInput.value);

    let rows = DATA.filter(x =>
        norm(x.lemma).includes(qLemma) &&
        (!qMicro || norm(x.micro).includes(qMicro))
    );

    if (sortKey) rows = rows.slice().sort(compare);

    tableBody.innerHTML = rows.map(x => `
        <tr onclick="window.location='${esc(x.link)}'" style="cursor:pointer">
            <td><b>${esc(x.lemma)}</b></td>
            <td><span class="badge">${esc(x.frequenza)}</span></td>
            <td>${esc(x.micro) || "-"}</td>
        </tr>`).join("");
}

headers.forEach(th => {
    th.addEventListener("click", () => {
        const key = th.dataset.key;
        if (sortKey === key) {
            sortDir = sortDir === "asc" ? "desc" : "asc";
        } else {
            sortKey = key;
            sortDir = "asc";
        }
        updateHeaders();
        render();
    });
});

advToggle.addEventListener("click", () => {
    const open = advPanel.style.display !== "block";
    advPanel.style.display = open ? "block" : "none";
    advToggle.textContent = open ? "− Ricerca avanzata" : "+ Ricerca avanzata";
    advToggle.setAttribute("aria-expanded", open);
    if (!open) {
        microInput.value = "";
        render();
    }
});

input.addEventListener("input", render);
microInput.addEventListener("input", render);
render();
</script>
